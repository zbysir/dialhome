name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # make web 先跑：它装 node_modules（typecheck 要）并把前端产物拷进 embed 目录
      - run: make web
      - run: make test
      # 交叉编译过一遍：发版是在 CI 上交叉编的，本机能编不代表都能编
      - name: 交叉编译检查
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "→ $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/dialhome
          done
